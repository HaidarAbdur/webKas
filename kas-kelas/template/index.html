<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Web Kas Kelas — Lihat saldo kas dan cek tagihan pembayaran kelas kamu.">
    <title>Kas Kelas — Beranda</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body data-page="index">

    <header class="hero-header">
        <p class="hero-subtitle">Kas Kelas</p>
        <h1 class="hero-title">XII TJKT 1</h1>
        <p class="hero-desc">Tagihan Rp 3.000/minggu · Rp 12.000/bulan</p>

        <div class="saldo-display">
            <div class="saldo-label">Saldo Kas Terkini</div>
            <div class="saldo-amount" id="saldo-amount">Memuat...</div>
            <div class="saldo-sub">
                <div class="saldo-sub-item">
                    <span class="saldo-sub-label">Total Masuk</span>
                    <span class="saldo-sub-value in" id="total-masuk">—</span>
                </div>
                <div class="saldo-sub-item">
                    <span class="saldo-sub-label">Total Keluar</span>
                    <span class="saldo-sub-value out" id="total-keluar">—</span>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="search-section">
            <p class="section-title">Cek Tagihan Kamu</p>
            <div class="search-wrap">
                <span class="search-icon">🔍</span>
                <input
                    type="text"
                    class="input search-input"
                    id="search-input"
                    placeholder="Ketik nama kamu..."
                    autocomplete="off"
                >
            </div>
            <div class="search-results" id="search-results"></div>
        </section>
    </main>

    <a href="/admin/login" class="footer-link">Panel Admin →</a>

    <div class="toast" id="toast"></div>
    <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
