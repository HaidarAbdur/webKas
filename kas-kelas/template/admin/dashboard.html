<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin — Kas Kelas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body data-page="dashboard">

    <nav class="admin-nav">
        <div class="admin-nav-inner">
            <div class="nav-brand">💰 Kas Kelas</div>
            <div class="nav-links">
                <a href="/admin/dashboard" class="nav-link active"><span>Dashboard</span></a>
                <a href="/admin/siswa" class="nav-link"><span>Siswa</span></a>
                <a href="/admin/pembayaran" class="nav-link"><span>Pembayaran</span></a>
                <a href="/admin/transaksi" class="nav-link"><span>Transaksi</span></a>
                <a href="/admin/logout" class="nav-logout">Keluar</a>
            </div>
        </div>
    </nav>

    <main class="admin-content">
        <div class="container-wide">

            <div class="page-header">
                <h1 class="page-title">Dashboard</h1>
                <p class="page-desc">Ringkasan kas kelas bulan <span id="bulan-label">—</span></p>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon green">💰</div>
                    <div class="stat-value" id="stat-saldo">—</div>
                    <div class="stat-label">Saldo Kas</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon blue">👥</div>
                    <div class="stat-value" id="stat-siswa">—</div>
                    <div class="stat-label">Total Siswa Aktif</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon green">✅</div>
                    <div class="stat-value" id="stat-lunas">—</div>
                    <div class="stat-label">Lunas Bulan Ini</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon red">❌</div>
                    <div class="stat-value" id="stat-belum">—</div>
                    <div class="stat-label">Belum Bayar</div>
                </div>
            </div>

            <div class="card">
                <p class="section-title" style="margin-bottom: 1rem;">Siswa Belum Bayar Bulan Ini</p>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Absen</th>
                                <th>Nama</th>
                            </tr>
                        </thead>
                        <tbody id="belum-tbody">
                            <tr><td colspan="2" class="loading">Memuat...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <div class="toast" id="toast"></div>
    <script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
